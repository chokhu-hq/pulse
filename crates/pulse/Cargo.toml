[package]
name = "pulse"
description = "Pusher protocol v7 compatible websocket server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["service", "tokio"] }
libc = { workspace = true }
md5 = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
socket2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "test-util"] }
tokio-tungstenite = { workspace = true }

[lints]
workspace = true
