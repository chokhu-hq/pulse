[server]
debug = false
port = 8099
hostname = "127.0.0.1"
region = "e2e"

[[apps]]
id = "e2e-app"
key = "e2e-key"
secret = "e2e-secret"
name = "e2e default app"
enabled = true
max_connections = 10000
max_channels_per_connection = 50
allowed_origins = ["*"]
max_message_size = 8192
max_batch_events = 100
enable_client_events = true
max_event_rate = 1000
max_event_burst = 1000

[[apps]]
id = "e2e-no-client"
key = "e2e-no-client-key"
secret = "e2e-no-client-secret"
name = "e2e client-events-disabled app"
enabled = true
max_connections = 10000
max_channels_per_connection = 50
allowed_origins = ["*"]
max_message_size = 8192
max_batch_events = 100
enable_client_events = false
max_event_rate = 1000
max_event_burst = 1000

[[apps]]
id = "e2e-ratelimited"
key = "e2e-ratelimited-key"
secret = "e2e-ratelimited-secret"
name = "e2e low-rate-limit app"
enabled = true
max_connections = 10000
max_channels_per_connection = 50
allowed_origins = ["*"]
max_message_size = 8192
max_batch_events = 100
enable_client_events = true
max_event_rate = 1
max_event_burst = 2
