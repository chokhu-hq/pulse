name: publish

# Publish only after the e2e suite passes on master.
on:
  workflow_run:
    workflows: [e2e]
    types: [completed]
    branches: [master]

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  docker:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/pulse-$os-$arch$ext" .
          done
          cd dist && sha256sum * > checksums.txt

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* \
            --target "$HEAD_SHA" \
            --title "latest" \
            --notes "Rolling build of master at ${HEAD_SHA::7}. Replaced on every push."
