name: bench

on:
  push:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build pulse
        run: go build -o pulse .

      - name: Run benchmarks
        run: |
          ulimit -n 65536
          go run ./bench -bin ./pulse -md "$RUNNER_TEMP/bench.md" -json "$RUNNER_TEMP/bench.json" -readme README.md

      - name: Publish summary
        if: always()
        run: test -f "$RUNNER_TEMP/bench.md" && cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Commit README benchmarks
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: update readme benchmarks"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: ${{ runner.temp }}/bench.json
          if-no-files-found: ignore
